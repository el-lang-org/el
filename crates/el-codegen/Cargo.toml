[package]
name = "el-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
el-ir = { path = "../el-ir", version = "=0.1.0" }
el-runtime = { path = "../el-runtime", version = "=0.1.0" }
el-span = { path = "../el-span", version = "=0.1.0" }
inkwell = { version = "=0.9.0", default-features = false, optional = true }

[dev-dependencies]
el-parser = { path = "../el-parser", version = "=0.1.0" }
el-resolve = { path = "../el-resolve", version = "=0.1.0" }
el-span = { path = "../el-span", version = "=0.1.0" }
el-types = { path = "../el-types", version = "=0.1.0" }

[features]
default = []
llvm = ["dep:inkwell", "inkwell/llvm22-1-prefer-dynamic"]
managed-runtime = ["el-runtime/boehm"]
gc-stress-test = ["managed-runtime", "el-runtime/gc-stress-test"]
allocation-failure-test = ["managed-runtime", "el-runtime/allocation-failure-test"]
# Lets CI type-check the private Inkwell boundary when LLVM is unavailable.
# It cannot link or execute backend tests.
llvm-api-check = ["dep:inkwell", "inkwell/llvm22-1-no-llvm-linking"]

[lints]
workspace = true
